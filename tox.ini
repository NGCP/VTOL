[tox]
minversion = 2.0
envlist = lint, vtol
skipsdist = True

[testenv]
deps = -r{toxinidir}/requirements.txt
recreate = False
passenv = *

[testenv:lint]
basepython=python3.6
deps = -r{toxinidir}/requirements.txt
commands = pylint --rcfile=.pylintrc examples src --evaluation 10.0-((float(5*error+warning+refactor+convention)/statement*10))+.5

